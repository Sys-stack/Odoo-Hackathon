<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget — Waypoint</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<nav class="topnav" id="topnav"></nav>

<main class="page">
  <div class="page-head">
    <div>
      <p class="sub"><a href="/trips">← My Trips</a></p>
      <h1 id="tripName">Loading…</h1>
      <p class="sub" id="tripDates"></p>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <a class="btn btn-outline" id="viewLink" href="#">View itinerary</a>
      <a class="btn btn-outline" id="planLink" href="#">Edit plan</a>
    </div>
  </div>

  <div id="overbudgetAlert" class="alert-banner warning" style="display:none;">
    ⚠ <span id="overbudgetText"></span>
  </div>

  <div class="stat-grid" id="statGrid">
    <div class="loading">Loading budget…</div>
  </div>

  <div class="card" style="margin-bottom:28px;">
    <div class="page-head" style="margin-bottom:20px;">
      <h1 style="font-size:18px;">Spend by category</h1>
      <div style="display:flex; align-items:center; gap:8px;">
        <label for="budgetInput" class="sans" style="font-size:12px; color:rgba(15,42,46,0.55);">Total budget ($)</label>
        <input type="number" id="budgetInput" min="0" step="10" style="width:110px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; padding:8px 10px; border:1px solid rgba(15,42,46,0.2); border-radius:4px;">
        <button class="btn btn-outline btn-sm" id="saveBudgetBtn">Save</button>
      </div>
    </div>
    <div id="chartArea" style="display:flex; gap:36px; flex-wrap:wrap; align-items:flex-start;">
      <div class="loading">Loading chart…</div>
    </div>
    <div style="margin-top:28px; padding-top:24px; border-top:1px solid var(--line);">
      <div class="bar-chart" id="barChart"></div>
    </div>
  </div>

  <div class="card">
    <div class="page-head" style="margin-bottom:16px;">
      <h1 style="font-size:18px;">Expense log</h1>
      <button class="btn btn-accent btn-sm" id="addExpenseBtn">+ Add expense</button>
    </div>
    <div id="expenseArea">
      <div class="loading">Loading expenses…</div>
    </div>
  </div>
</main>

<!-- Add/Edit Expense modal -->
<div class="modal-overlay" id="expenseModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="expenseModalTitle">Add expense</h3>
      <button class="modal-close" id="closeExpenseModal">&times;</button>
    </div>
    <div class="field">
      <label for="expenseCategory">Category</label>
      <select id="expenseCategory">
        <option value="transport">Transport</option>
        <option value="stay">Stay</option>
        <option value="meals">Meals</option>
        <option value="misc">Misc</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="expenseAmount">Amount ($)</label>
        <input type="number" id="expenseAmount" min="0" step="1" value="0">
      </div>
      <div class="field">
        <label for="expenseDate">Date</label>
        <input type="date" id="expenseDate">
      </div>
    </div>
    <div class="field">
      <label for="expenseNotes">Notes <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
      <input type="text" id="expenseNotes" placeholder="e.g. airport taxi">
    </div>
    <div class="form-msg" id="expenseModalMsg"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-accent" id="saveExpenseBtn">Save</button>
      <button class="btn btn-outline" id="deleteExpenseBtn" style="display:none;">Delete</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  const TRIP_ID = {{ trip_id }};
  let editingExpenseId = null;
  let latestBudget = null;

  if (requireAuth()) {
    renderNav('trips');
    document.getElementById('viewLink').href = `/trips/${TRIP_ID}`;
    document.getElementById('planLink').href = `/trips/${TRIP_ID}/plan`;
    loadAll();
  }

  async function loadAll() {
    try {
      const [{ trip }, budget] = await Promise.all([
        apiFetch(`/api/trips/${TRIP_ID}`),
        apiFetch(`/api/trips/${TRIP_ID}/budget`),
      ]);
      document.getElementById('tripName').textContent = trip.trip_name;
      document.getElementById('tripDates').textContent =
        `${formatDateRange(trip.start_date, trip.end_date)} · ${dayCount(trip.start_date, trip.end_date)} days`;
      document.getElementById('budgetInput').value = trip.total_budget != null ? trip.total_budget : '';
      renderBudget(budget);
    } catch (err) {
      document.getElementById('statGrid').innerHTML = `<div class="empty">Couldn't load budget: ${escapeHtml(err.message)}</div>`;
    }
  }

  function renderBudget(budget) {
    latestBudget = budget;

    const alertEl = document.getElementById('overbudgetAlert');
    if (budget.is_overbudget) {
      document.getElementById('overbudgetText').textContent =
        `You're ${formatMoney(Math.abs(budget.remaining))} over your ${formatMoney(budget.total_budget)} budget.`;
      alertEl.style.display = 'flex';
    } else {
      alertEl.style.display = 'none';
    }

    document.getElementById('statGrid').innerHTML = `
      <div class="stat-card">
        <div class="label">Total budget</div>
        <div class="value">${budget.total_budget != null ? formatMoney(budget.total_budget) : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Total spent</div>
        <div class="value">${formatMoney(budget.total_spent)}</div>
      </div>
      <div class="stat-card">
        <div class="label">Remaining</div>
        <div class="value ${budget.is_overbudget ? 'warn' : 'ok'}">${budget.remaining != null ? formatMoney(budget.remaining) : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Avg cost / day</div>
        <div class="value">${formatMoney(budget.average_cost_per_day)}</div>
      </div>
    `;

    renderChart(budget.breakdown_by_category);
    renderExpenses(budget.expenses);
  }

  function renderChart(breakdown) {
    const entries = Object.entries(breakdown).filter(([, v]) => v > 0);
    const total = entries.reduce((sum, [, v]) => sum + v, 0);

    const chartArea = document.getElementById('chartArea');
    if (total === 0) {
      chartArea.innerHTML = `<div class="stop-empty">No spend logged yet — add an expense or an activity cost to see the breakdown.</div>`;
      document.getElementById('barChart').innerHTML = '';
      return;
    }

    let acc = 0;
    const gradientParts = entries.map(([cat, v]) => {
      const start = (acc / total) * 100;
      acc += v;
      const end = (acc / total) * 100;
      return `${categoryColor(cat)} ${start}% ${end}%`;
    });

    chartArea.innerHTML = `
      <div class="pie-chart" style="background: conic-gradient(${gradientParts.join(', ')});"></div>
      <div class="pie-legend">
        ${entries.map(([cat, v]) => `
          <div class="item">
            <span class="swatch" style="background:${categoryColor(cat)};"></span>
            <span style="text-transform:capitalize;">${escapeHtml(cat)}</span>
            <span class="pct">${formatMoney(v)} · ${Math.round((v / total) * 100)}%</span>
          </div>`).join('')}
      </div>`;

    const maxVal = Math.max(...entries.map(([, v]) => v));
    document.getElementById('barChart').innerHTML = entries.map(([cat, v]) => `
      <div class="bar-row">
        <div class="cat-label">${escapeHtml(cat)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v / maxVal) * 100}%; background:${categoryColor(cat)};"></div></div>
        <div class="amt">${formatMoney(v)}</div>
      </div>`).join('');
  }

  function renderExpenses(expenses) {
    const area = document.getElementById('expenseArea');
    if (!expenses.length) {
      area.innerHTML = `<div class="stop-empty">No expenses logged yet. Itinerary activity costs are tracked automatically — use "Add expense" for transport, stay, meals, or other spend.</div>`;
      return;
    }
    area.innerHTML = expenses.slice().reverse().map(e => `
      <div class="expense-row">
        <div>
          <span class="tag cat-tag">${escapeHtml(e.category)}</span>
          <span style="margin-left:10px;">${escapeHtml(e.notes || 'No notes')}</span>
          <span class="meta" style="color:rgba(15,42,46,0.45); margin-left:8px;">${formatDate(e.expense_date)}</span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="amount">${formatMoney(e.amount)}</span>
          <button class="icon-btn" data-edit="${e.expense_id}" title="Edit">✎</button>
        </div>
      </div>`).join('');

    expenses.forEach(e => {
      document.querySelector(`[data-edit="${e.expense_id}"]`)?.addEventListener('click', () => openExpenseModal(e));
    });
  }

  /* ---------- Budget total ---------- */
  document.getElementById('saveBudgetBtn').addEventListener('click', async () => {
    const raw = document.getElementById('budgetInput').value;
    try {
      await apiFetch(`/api/trips/${TRIP_ID}`, {
        method: 'PUT',
        body: JSON.stringify({ total_budget: raw === '' ? null : Number(raw) }),
      });
      const budget = await apiFetch(`/api/trips/${TRIP_ID}/budget`);
      renderBudget(budget);
    } catch (err) {
      alert(`Couldn't save budget: ${err.message}`);
    }
  });

  /* ---------- Expense modal ---------- */
  const expenseModal = document.getElementById('expenseModal');

  function openExpenseModal(expense) {
    editingExpenseId = expense ? expense.expense_id : null;
    document.getElementById('expenseModalTitle').textContent = expense ? 'Edit expense' : 'Add expense';
    document.getElementById('expenseCategory').value = expense ? expense.category : 'transport';
    document.getElementById('expenseAmount').value = expense ? expense.amount : 0;
    document.getElementById('expenseDate').value = expense ? expense.expense_date : todayISO();
    document.getElementById('expenseNotes').value = expense ? (expense.notes || '') : '';
    document.getElementById('expenseModalMsg').className = 'form-msg';
    document.getElementById('deleteExpenseBtn').style.display = expense ? 'inline-flex' : 'none';
    expenseModal.classList.add('show');
  }

  document.getElementById('addExpenseBtn').addEventListener('click', () => openExpenseModal(null));
  document.getElementById('closeExpenseModal').addEventListener('click', () => expenseModal.classList.remove('show'));
  expenseModal.addEventListener('click', (e) => { if (e.target === expenseModal) expenseModal.classList.remove('show'); });

  document.getElementById('saveExpenseBtn').addEventListener('click', async () => {
    const msg = document.getElementById('expenseModalMsg');
    const payload = {
      category: document.getElementById('expenseCategory').value,
      amount: Number(document.getElementById('expenseAmount').value || 0),
      expense_date: document.getElementById('expenseDate').value,
      notes: document.getElementById('expenseNotes').value.trim(),
    };
    if (!payload.expense_date) {
      msg.textContent = 'Choose a date.';
      msg.className = 'form-msg show error';
      return;
    }
    try {
      if (editingExpenseId) {
        await apiFetch(`/api/expenses/${editingExpenseId}`, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await apiFetch(`/api/trips/${TRIP_ID}/expenses`, { method: 'POST', body: JSON.stringify(payload) });
      }
      expenseModal.classList.remove('show');
      const budget = await apiFetch(`/api/trips/${TRIP_ID}/budget`);
      renderBudget(budget);
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'form-msg show error';
    }
  });

  document.getElementById('deleteExpenseBtn').addEventListener('click', async () => {
    if (!editingExpenseId || !confirm('Delete this expense?')) return;
    try {
      await apiFetch(`/api/expenses/${editingExpenseId}`, { method: 'DELETE' });
      expenseModal.classList.remove('show');
      const budget = await apiFetch(`/api/trips/${TRIP_ID}/budget`);
      renderBudget(budget);
    } catch (err) {
      alert(`Couldn't delete: ${err.message}`);
    }
  });
</script>
</body>
</html>
