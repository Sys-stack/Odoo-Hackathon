<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Waypoint</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<nav class="topnav" id="topnav"></nav>

<main class="page" style="max-width:760px;">
  <div class="page-head">
    <div>
      <h1>Your profile</h1>
      <p class="sub">Update your details and manage your trips.</p>
    </div>
  </div>

  <div class="card" style="margin-bottom:28px;">
    <div class="form-msg" id="formMsg"></div>

    <div class="avatar-upload-row">
      <img class="avatar-lg" id="avatarPreview" src="" alt="Profile photo">
      <div>
        <label class="btn btn-outline btn-sm" for="photoFile" style="cursor:pointer;">Change photo</label>
        <input type="file" id="photoFile" accept="image/*" style="display:none;">
        <p class="sub" style="margin-top:8px; font-size:12px;">JPG or PNG, stored with your account.</p>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
    </div>

    <div class="field">
      <label for="language">Language preference</label>
      <select id="language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="pt">Português</option>
        <option value="de">Deutsch</option>
        <option value="ja">日本語</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>

    <div class="field">
      <label for="newPassword">New password <span style="text-transform:none; letter-spacing:0;">(optional, min 8 characters)</span></label>
      <input type="password" id="newPassword" placeholder="Leave blank to keep your current password">
    </div>

    <button class="btn btn-accent" id="saveProfileBtn">Save changes</button>
  </div>

  <section style="margin-bottom:36px;">
    <div class="section-label">Preplanned trips</div>
    <div id="preplannedArea" class="grid"><div class="loading">Loading…</div></div>
  </section>

  <section style="margin-bottom:36px;">
    <div class="section-label">Previous trips</div>
    <div id="previousArea" class="grid"><div class="loading">Loading…</div></div>
  </section>

  <div class="card" style="border-color: rgba(228,87,61,0.3);">
    <h3 style="font-size:16px; margin-bottom:8px;">Delete account</h3>
    <p class="sub" style="margin-bottom:14px;">This permanently deletes your account and every trip you own. This can't be undone.</p>
    <button class="btn btn-danger" id="deleteAccountBtn">Delete my account</button>
  </div>
</main>

<script src="/static/js/app.js"></script>
<script>
  let photoDataUrl = null;

  if (requireAuth()) {
    renderNav('profile');
    loadProfile();
    loadTrips();
  }

  async function loadProfile() {
    try {
      const { user } = await apiFetch('/api/auth/me');
      setSession(getToken(), user); // keep localStorage copy fresh
      document.getElementById('fullName').value = user.full_name || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('language').value = user.language_preference || 'en';
      document.getElementById('avatarPreview').src = user.profile_picture_url || fallbackAvatar(user);
    } catch (err) {
      showMessage(`Couldn't load your profile: ${err.message}`, 'error');
    }
  }

  function fallbackAvatar(user) {
    const initial = (user.full_name || user.email || '?').trim()[0].toUpperCase();
    return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="100%" height="100%" fill="%230B2226"/><text x="50%" y="50%" fill="%23F4EFE6" font-family="Helvetica" font-size="40" text-anchor="middle" dy=".35em">${initial}</text></svg>`)}`;
  }

  document.getElementById('photoFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      photoDataUrl = reader.result;
      document.getElementById('avatarPreview').src = photoDataUrl;
    };
    reader.readAsDataURL(file);
  });

  function showMessage(text, type) {
    const el = document.getElementById('formMsg');
    el.textContent = text;
    el.className = `form-msg show ${type}`;
  }

  document.getElementById('saveProfileBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveProfileBtn');
    const payload = {
      full_name: document.getElementById('fullName').value.trim(),
      email: document.getElementById('email').value.trim(),
      language_preference: document.getElementById('language').value,
    };
    if (photoDataUrl) payload.profile_picture_url = photoDataUrl;
    const newPassword = document.getElementById('newPassword').value;
    if (newPassword) payload.password = newPassword;

    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const { user } = await apiFetch('/api/auth/me', { method: 'PUT', body: JSON.stringify(payload) });
      setSession(getToken(), user);
      document.getElementById('newPassword').value = '';
      showMessage('Profile updated.', 'success');
      renderNav('profile');
    } catch (err) {
      showMessage(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save changes';
    }
  });

  async function loadTrips() {
    const preplannedArea = document.getElementById('preplannedArea');
    const previousArea = document.getElementById('previousArea');
    try {
      const { trips } = await apiFetch('/api/trips');
      const today = todayISO();
      const preplanned = trips.filter(t => t.start_date >= today);
      const previous = trips.filter(t => t.start_date < today);

      preplannedArea.innerHTML = preplanned.length
        ? preplanned.map(tripCardHtml).join('')
        : `<div class="empty" style="grid-column:1/-1;">No upcoming trips yet.</div>`;

      previousArea.innerHTML = previous.length
        ? previous.map(tripCardHtml).join('')
        : `<div class="empty" style="grid-column:1/-1;">No past trips yet.</div>`;
    } catch (err) {
      preplannedArea.innerHTML = `<div class="empty" style="grid-column:1/-1;">Couldn't load trips.</div>`;
      previousArea.innerHTML = '';
    }
  }

  function tripCardHtml(t) {
    const cover = t.cover_photo_url ? `background-image:url('${t.cover_photo_url}')` : '';
    return `
      <div class="trip-card">
        <div class="cover" style="${cover}"></div>
        <div class="body">
          <h3>${escapeHtml(t.trip_name)}</h3>
          <div class="meta">${formatDateRange(t.start_date, t.end_date)}</div>
          <div class="actions">
            <a href="/trips/${t.trip_id}" class="btn btn-outline btn-sm">View</a>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
    if (!confirm('Delete your account and all your trips? This cannot be undone.')) return;
    if (!confirm('Are you absolutely sure? This is permanent.')) return;
    try {
      await apiFetch('/api/auth/me', { method: 'DELETE' });
      clearSession();
      window.location.href = '/login';
    } catch (err) {
      alert(`Couldn't delete account: ${err.message}`);
    }
  });
</script>
</body>
</html>
