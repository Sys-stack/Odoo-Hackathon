<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trips — Waypoint</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<nav class="topnav" id="topnav"></nav>

<main class="page">
  <div class="page-head">
    <div>
      <h1>My Trips</h1>
      <p class="sub" id="countSub">Loading…</p>
    </div>
    <a href="/trips/new" class="btn btn-accent">+ Plan New Trip</a>
  </div>

  <div id="tripsArea" class="grid">
    <div class="loading">Loading your trips…</div>
  </div>
</main>

<script src="/static/js/app.js"></script>
<script>
  if (requireAuth()) {
    renderNav('trips');
    loadTrips();
  }

  async function loadTrips() {
    const area = document.getElementById('tripsArea');
    try {
      const { trips } = await apiFetch('/api/trips');
      document.getElementById('countSub').textContent =
        `${trips.length} trip${trips.length === 1 ? '' : 's'} total`;

      if (trips.length === 0) {
        area.innerHTML = `
          <div class="empty" style="grid-column:1/-1;">
            <h3>No trips yet</h3>
            <p>Start planning your first multi-city adventure.</p>
            <div style="margin-top:16px;"><a href="/trips/new" class="btn btn-primary">Plan a trip</a></div>
          </div>`;
        return;
      }

      area.innerHTML = trips.map(tripCardHtml).join('');

      trips.forEach(t => {
        const btn = document.getElementById(`delete-${t.trip_id}`);
        if (btn) btn.addEventListener('click', () => deleteTrip(t.trip_id, t.trip_name));
      });
    } catch (err) {
      area.innerHTML = `<div class="empty" style="grid-column:1/-1;">Couldn't load your trips: ${escapeHtml(err.message)}</div>`;
    }
  }

  function tripCardHtml(t) {
    const cover = t.cover_photo_url ? `background-image:url('${t.cover_photo_url}')` : '';
    return `
      <div class="trip-card">
        <div class="cover" style="${cover}"></div>
        <div class="body">
          <h3>${escapeHtml(t.trip_name)}</h3>
          <div class="meta">${formatDateRange(t.start_date, t.end_date)}</div>
          <div class="stats">
            <span>${t.stop_count} stop${t.stop_count === 1 ? '' : 's'}</span>
            <span>${formatMoney(t.estimated_cost)}</span>
          </div>
          <div class="actions">
            <a href="/trips/${t.trip_id}" class="btn btn-outline btn-sm">View</a>
            <a href="/trips/${t.trip_id}/plan" class="btn btn-primary btn-sm">Edit</a>
            <button class="btn btn-danger btn-sm" id="delete-${t.trip_id}">Delete</button>
          </div>
        </div>
      </div>`;
  }

  async function deleteTrip(tripId, tripName) {
    if (!confirm(`Delete "${tripName}"? This can't be undone.`)) return;
    try {
      await apiFetch(`/api/trips/${tripId}`, { method: 'DELETE' });
      loadTrips();
    } catch (err) {
      alert(`Couldn't delete trip: ${err.message}`);
    }
  }
</script>
</body>
</html>
