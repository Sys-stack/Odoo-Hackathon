<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Waypoint</title>
<style>
  :root{
    --ink:#0F2A2E;
    --paper:#F4EFE6;
    --teal:#123B40;
    --teal-deep:#0B2226;
    --sun:#E8823C;
    --sun-soft:#F3B26B;
    --line: rgba(244,239,230,0.16);
    --error:#E4573D;
    --radius: 4px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family: 'Iowan Old Style', 'Georgia', serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:grid;
    grid-template-columns: 1.1fr 1fr;
  }

  @media (max-width: 860px){
    body{ grid-template-columns: 1fr; }
    .side{ display:none; }
    
  }

  /* LEFT: route panel */
  .side{
    background: var(--teal-deep);
    color: var(--paper);
    position:relative;
    overflow:hidden;
    padding: 56px 48px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .side::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(232,130,60,0.16), transparent 40%),
      radial-gradient(circle at 80% 75%, rgba(232,130,60,0.10), transparent 45%);
    pointer-events:none;
  }

  .brand{
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    color: var(--sun-soft);
    z-index:1;
  }

  .route{
    z-index:1;
  }

  .route h1{
    font-size: clamp(34px, 4vw, 52px);
    line-height:1.05;
    font-weight: 500;
    max-width: 9ch;
    margin-bottom: 28px;
  }

  .route h1 em{
    font-style: italic;
    color: var(--sun-soft);
  }

  .route-line{
    display:flex;
    flex-direction:column;
    gap:0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
  }

  .stop{
    display:grid;
    grid-template-columns: 14px 1fr auto;
    align-items:center;
    gap: 14px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    color: rgba(244,239,230,0.75);
  }
  .stop:last-child{ border-bottom: 1px solid var(--line); }

  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--sun-soft);
  }

  .stop .cost{
    color: rgba(244,239,230,0.45);
    font-variant-numeric: tabular-nums;
  }

  .side-foot{
    z-index:1;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: rgba(244,239,230,0.4);
    letter-spacing:0.02em;
  }

  /* RIGHT: form panel */
  .panel{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 24px;
  }

  .form-wrap{
    width:100%;
    max-width: 380px;
  }

  .form-wrap h2{
    font-size: 30px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .sub{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: rgba(15,42,46,0.6);
    margin-bottom: 34px;
  }

  .sub a{ color: var(--sun); text-decoration:none; font-weight:600; }
  .sub a:hover{ text-decoration:underline; }

  form{ display:flex; flex-direction:column; gap: 18px; }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .field label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(15,42,46,0.55);
  }

  .field input{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    padding: 13px 14px;
    border: 1px solid rgba(15,42,46,0.2);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .field input:focus{
    border-color: var(--sun);
    box-shadow: 0 0 0 3px rgba(232,130,60,0.15);
  }

  .field input.invalid{
    border-color: var(--error);
  }

  .field-error{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: var(--error);
    min-height: 14px;
    display:none;
  }

  .field-error.show{ display:block; }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    margin-top: -4px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap: 8px;
    color: rgba(15,42,46,0.65);
  }

  .remember input{ accent-color: var(--sun); width:14px; height:14px; }

  .row-between a{
    color: rgba(15,42,46,0.65);
    text-decoration:none;
  }
  .row-between a:hover{ color: var(--sun); }

  .submit{
    margin-top: 8px;
    background: var(--teal);
    color: var(--paper);
    border:none;
    border-radius: var(--radius);
    padding: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    font-weight:600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor:pointer;
    transition: background .15s ease, transform .1s ease;
    position:relative;
  }

  .submit:hover{ background: var(--teal-deep); }
  .submit:active{ transform: translateY(1px); }

  .submit:disabled{
    opacity: 0.6;
    cursor: default;
  }

  .form-msg{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius);
    display:none;
  }
  .form-msg.show{ display:block; }
  .form-msg.error{
    background: rgba(228,87,61,0.1);
    color: var(--error);
    border: 1px solid rgba(228,87,61,0.25);
  }
  .form-msg.success{
    background: rgba(18,59,64,0.08);
    color: var(--teal);
    border: 1px solid rgba(18,59,64,0.2);
  }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin: 26px 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: rgba(15,42,46,0.4);
    text-transform:uppercase;
    letter-spacing: 0.1em;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: rgba(15,42,46,0.15);
  }

  .alt{
    width:100%;
    padding: 12px;
    border: 1px solid rgba(15,42,46,0.2);
    border-radius: var(--radius);
    background: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    cursor:pointer;
    color: var(--ink);
    transition: border-color .15s ease, background .15s ease;
  }
  .alt:hover{ border-color: var(--ink); background: #fbf9f5; }
</style>
</head>
<body>

  <aside class="side">
    <div class="brand">Waypoint</div>
    <div class="route">
      <h1>Plan it once. <em>Wander</em> freely.</h1>
      <div class="route-line">
        <div class="stop"><span class="dot"></span><span>Lisbon → Porto</span><span class="cost">$210</span></div>
        <div class="stop"><span class="dot"></span><span>Porto → Marrakech</span><span class="cost">$340</span></div>
        <div class="stop"><span class="dot"></span><span>Marrakech → Fes</span><span class="cost">$95</span></div>
      </div>
    </div>
    <div class="side-foot">Trips, stops, and budgets — kept in one place.</div>
  </aside>

  <main class="panel">
    <div class="form-wrap">
      <h2>Welcome back</h2>
      <p class="sub">New here? <a href="#" id="signupLink">Create an account</a></p>

      <div class="form-msg" id="formMsg"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <span class="field-error" id="emailError">Enter a valid email address.</span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <span class="field-error" id="passwordError">Password is required.</span>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">Sign in</button>
      </form>

      <div class="divider">or</div>
      <button type="button" class="alt" id="googleBtn">Continue with Google</button>
    </div>
  </main>

<script>
  if (localStorage.getItem('waypoint_token')) {
    window.location.href = '/dashboard';
  }

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const formMsg = document.getElementById('formMsg');
  const submitBtn = document.getElementById('submitBtn');

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function setFieldState(input, errorEl, valid) {
    input.classList.toggle('invalid', !valid);
    errorEl.classList.toggle('show', !valid);
  }

  function showMessage(text, type) {
    formMsg.textContent = text;
    formMsg.className = `form-msg show ${type}`;
  }

  function clearMessage() {
    formMsg.className = 'form-msg';
    formMsg.textContent = '';
  }

  emailInput.addEventListener('input', () => {
    if (emailInput.classList.contains('invalid')) {
      setFieldState(emailInput, emailError, isValidEmail(emailInput.value.trim()));
    }
  });

  passwordInput.addEventListener('input', () => {
    if (passwordInput.classList.contains('invalid')) {
      setFieldState(passwordInput, passwordError, passwordInput.value.length > 0);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    const emailValid = isValidEmail(email);
    const passwordValid = password.length > 0;

    setFieldState(emailInput, emailError, emailValid);
    setFieldState(passwordInput, passwordError, passwordValid);

    if (!emailValid || !passwordValid) {
      showMessage('Fix the highlighted fields and try again.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      // Replace with your real auth endpoint.
      // Expected request body maps to the Users table: { email, password }
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.message || 'Invalid email or password.');
      }

      const data = await response.json();
      // Expected: { token, user: { user_id, email, full_name, role, ... } }
      if (data.token) {
        localStorage.setItem('waypoint_token', data.token);
      }
      if (data.user) {
        localStorage.setItem('waypoint_user', JSON.stringify(data.user));
      }

      showMessage('Signed in. Redirecting…', 'success');
      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 700);

    } catch (err) {
      showMessage(err.message || 'Something went wrong. Please try again.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });

  document.getElementById('signupLink').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = '/register';
  });

  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    // Not implemented in this MVP.
    showMessage("Password reset isn't available yet — contact support for now.", 'error');
  });

  document.getElementById('googleBtn').addEventListener('click', () => {
    window.location.href = '/api/auth/google';
  });
</script>

</body>
</html>
